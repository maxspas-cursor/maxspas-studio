<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <base href="/demos/_bot-preview/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bot preview</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;font-family:system-ui,sans-serif}
    .phone{width:320px;height:640px;border-radius:36px;background:#0e1621;border:3px solid #1f2c3a;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column}
    .top{background:#17212b;padding:14px 16px 12px;display:flex;gap:12px;align-items:center}
    .ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#22d3ee);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem}
    .meta b{display:block;color:#fff;font-size:.95rem}
    .meta span{color:#8a97a8;font-size:.75rem}
    .chat{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;background:#0e1621}
    .bubble{max-width:88%;padding:10px 12px;border-radius:14px;font-size:.84rem;line-height:1.35}
    .bot{align-self:flex-start;background:#182533;color:#e8eef5}
    .me{align-self:flex-end;background:#2b5278;color:#fff}
    .btn{display:block;margin-top:8px;padding:8px 10px;border-radius:10px;background:#242f3d;color:#7dd3fc;font-size:.78rem;text-align:center}
    .composer{padding:10px;background:#17212b;display:flex;gap:8px;align-items:center}
    .composer div{flex:1;height:36px;border-radius:18px;background:#242f3d}
    .composer span{width:36px;height:36px;border-radius:50%;background:#2b5278}
  </style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="ava">MS</div>
      <div class="meta"><b>@maxspas_studio_bot</b><span>онлайн</span></div>
    </div>
    <div class="chat">
      <div class="bubble bot">
        MAXSPAS Studio · сайты, боты, 3D<br>
        Выберите раздел:
        <div class="btn">🌐 Сайт / лендинг</div>
        <div class="btn">🤖 Telegram-бот</div>
        <div class="btn">🧊 3D GRBNK</div>
        <div class="btn">✉️ Оставить заявку</div>
      </div>
      <div class="bubble me">Сайт + бот под ключ</div>
      <div class="bubble bot">Ок. Срок 5–7 дней, от 18 000 ₽. Напишите нишу и город — пришлю план.</div>
    </div>
    <div class="composer"><div></div><span></span></div>
  </div>
</body>
</html>
